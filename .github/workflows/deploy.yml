name: Blue-Green Deployment (PHP Seminar Demo)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Prepare Blue (Stable) Environment if not exists
      - name: Prepare Stable Environment
        run: |
          if [ ! -d "blue" ]; then
            echo "No stable environment found. Creating initial Blue (stable) version..."
            mkdir -p blue
            cp -r $(ls -A | grep -v blue | grep -v green | grep -v current | grep -v .git) blue/
          fi
          echo "✅ Blue environment ready (contains working db.php)."

      # Step 3: Deploy to Green
      - name: Deploy to Green
        run: |
          echo "Deploying current commit to Green environment..."
          rm -rf green/
          mkdir -p green/
          cp -r $(ls -A | grep -v blue | grep -v green | grep -v current | grep -v .git) green/
          echo "✅ Green environment ready."

      # Step 4: Run automated test on Green
      - name: Test Green Deployment
        run: |
          echo "Testing Green environment..."
          if grep -q "mysqli_connect" green/db.php; then
            echo "✅ Test passed. Updating Blue (stable) environment..."
            rm -rf blue/
            mv green/ blue/
            echo "🔹 Deployment succeeded. Blue now updated."
          else
            echo "❌ Test failed. Rolling back to previous Blue version..."
            rm -rf green/
            echo "🔁 Rollback triggered successfully — stable version preserved"
            echo "🔹 Contents of stable db.php after rollback:"
            cat blue/db.php || echo "No stable db.php found"
            echo "🔹 Files in stable environment:"
            ls -R blue/
            exit 1
          fi

      # Step 5: Update current environment to point to Blue
      - name: Update Current Environment
        run: |
          if [ -d "current" ]; then
            rm -rf current
          fi
          ln -s blue current
          echo "✅ Current environment now points to Blue (stable)."
          echo "🔹 Files in current environment:"
          ls -R current/
