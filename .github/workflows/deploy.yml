name: Deploy PHP App (Blue-Green)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy to Green environment
        run: |
          echo "Deploying to Green environment..."
          rsync -avz --delete -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/green/

      - name: Test Green Deployment
        run: |
          echo "Testing Green environment..."
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/testdb.php" > status.txt
          cat status.txt
          STATUS=$(cat status.txt)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Test passed. Switching traffic to Green."
            ssh -i private_key.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "sudo ln -sf /etc/apache2/sites-available/green.conf /etc/apache2/sites-enabled/000-default.conf && sudo systemctl reload apache2"
          else
            echo "❌ Test failed. Rollback to Blue."
            ssh -i private_key.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "sudo ln -sf /etc/apache2/sites-available/blue.conf /etc/apache2/sites-enabled/000-default.conf && sudo systemctl reload apache2"
            exit 1
          fi

