name: Blue-Green Deployment (PHP Seminar Demo)

on:
push:
branches:
- main

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:

  # Step 1: Checkout Repository
  - name: Checkout Code
    uses: actions/checkout@v4

  # Step 2: Install PHP
  - name: Setup PHP
    uses: shivammathur/setup-php@v2
    with:
      php-version: '8.2'

  # Step 3: Create Blue Environment
  - name: Prepare Blue Environment
    run: |
      if [ ! -d "blue" ]; then
        echo "🔹 Creating Blue Environment..."
        mkdir blue

        cp -r \
          add_expense.php \
          dashboard.php \
          db.php \
          login.php \
          logout.php \
          signup.php \
          testdb.php \
          list_expenses.php \
          README.md \
          blue/ 2>/dev/null || true
      fi

  # Step 4: Deploy to Green
  - name: Deploy to Green Environment
    run: |
      echo "🚀 Deploying to Green..."

      rm -rf green
      mkdir green

      cp -r \
        add_expense.php \
        dashboard.php \
        db.php \
        login.php \
        logout.php \
        signup.php \
        testdb.php \
        list_expenses.php \
        README.md \
        green/ 2>/dev/null || true

      echo "✅ Green Deployment Complete"

  # Step 5: Run Automated Tests
  - name: Test Green Deployment
    run: |
      echo "🔍 Running Green Environment Checks..."

      FAIL=false

      echo "📁 Checking Critical Files..."

      FILES=(
        "green/db.php"
        "green/login.php"
        "green/dashboard.php"
        "green/add_expense.php"
      )

      for f in "${FILES[@]}"
      do
        if [ ! -f "$f" ]; then
          echo "❌ Missing file: $f"
          FAIL=true
        else
          echo "✅ Found: $f"
        fi
      done

      echo "🧩 Running PHP Syntax Checks..."

      for file in $(find green -name "*.php")
      do
        echo "Checking $file"

        php -l "$file" > /dev/null

        if [ $? -ne 0 ]; then
          echo "❌ Syntax Error: $file"
          FAIL=true
        fi
      done

      if [ "$FAIL" = true ]; then
        echo "❌ Tests Failed"
        echo "🔁 Rolling Back..."

        rm -rf green

        exit 1
      fi

      echo "✅ All Tests Passed"

  # Step 6: Promote Green to Blue
  - name: Promote Green to Blue
    run: |
      echo "🚀 Promoting Green to Blue..."

      rm -rf blue
      mv green blue

      echo "✅ Blue Updated"

  # Step 7: Update Current Environment
  - name: Update Current Link
    run: |
      rm -rf current

      ln -s blue current

      echo "✅ Current -> Blue"

  # Step 8: Success Message
  - name: Deployment Complete
    run: |
      echo "🎉 Blue-Green Deployment Successful"
```
