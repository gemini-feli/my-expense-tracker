name: Simulate Blue-Green Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulate Deploy to Green
        run: |
          echo "Deploying current code to Green environment..."
          rm -rf green/        # Clean previous green environment
          mkdir -p green/
          cp -r $(ls -A | grep -v green | grep -v blue) green/
          echo "✅ Green environment ready."

      - name: Run Automated Test
        run: |
          echo "Testing Green environment..."
          if grep -q "mysqli_connect" db.php; then
            echo "✅ Test passed. Switching traffic to Green."
            rm -rf blue/
            mv green/ blue/
          else
            echo "❌ Test failed. Rolling back to previous Blue version..."
            rm -rf green/
            echo "🔁 Rollback triggered successfully — old stable version restored"
            echo "🔹 Contents of stable db.php:"
            cat blue/db.php || echo "No stable db.php found"
            exit 1
          fi

      - name: Show Deployment Result
        run: |
          if [ -d "blue" ]; then
            echo "✔ Active environment: Blue (Stable)"
            echo "🔹 Files in stable version:"
            ls -R blue/
          else
            echo "❌ Deployment failed, no stable version."
          fi
