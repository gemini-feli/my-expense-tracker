name: Simulate Blue-Green Deployment (Seminar Demo)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Blue Environment (if not exists)
        run: |
          if [ ! -d "blue" ]; then
            echo "No Blue environment found. Creating initial stable version..."
            mkdir -p blue
            cp -r $(ls -A | grep -v blue | grep -v green) blue/
          fi
          echo "✅ Blue environment ready."

      - name: Simulate Deploy to Green
        run: |
          echo "Deploying current code to Green environment..."
          rm -rf green/
          mkdir -p green/
          cp -r $(ls -A | grep -v blue | grep -v green) green/
          echo "✅ Green environment ready."

      - name: Run Automated Test
        run: |
          echo "Testing Green environment..."
          # Fail test if mysqli_connect is missing in db.php
          if grep -q "mysqli_connect" green/db.php; then
            echo "✅ Test passed. Switching traffic to Green."
            rm -rf blue/
            mv green/ blue/
          else
            echo "❌ Test failed. Rolling back to previous Blue version..."
            rm -rf green/
            echo "🔁 Rollback triggered successfully — old stable version restored"
            echo "🔹 Contents of stable db.php after rollback:"
            cat blue/db.php || echo "No stable db.php found"
            echo "🔹 Files in stable environment:"
            ls -R blue/
            exit 1
          fi

      - name: Show Deployment Result
        run: |
          if [ -d "blue" ]; then
            echo "✔ Active environment: Blue (Stable)"
            echo "🔹 Files in stable environment:"
            ls -R blue/
          else
            echo "❌ Deployment failed, no stable environment."
          fi
