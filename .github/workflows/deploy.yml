name: Blue-Green Deployment (PHP Seminar Demo)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Prepare Blue Environment
        run: |
          echo "🔵 Preparing Blue Environment..."
          mkdir -p blue
          cp -r *.php blue/ 2>/dev/null || true

      - name: Deploy to Green Environment
        run: |
          echo "🟢 Deploying to Green..."
          rm -rf green
          mkdir green
          cp -r *.php green/ 2>/dev/null || true
          echo "✅ Green Deployment Complete"

      - name: Test Green Deployment
        run: |
          echo "🔍 Running Green Environment Checks..."

          FAIL=false

          FILES=(
            "green/db.php"
            "green/login.php"
            "green/dashboard.php"
            "green/add_expense.php"
          )

          for f in "${FILES[@]}"
          do
            if [ ! -f "$f" ]; then
              echo "❌ Missing file: $f"
              FAIL=true
            else
              echo "✅ Found: $f"
            fi
          done

          for file in $(find green -name "*.php")
          do
            echo "🧩 Checking syntax in $file"

            php -l "$file" > /dev/null 2>&1

            if [ $? -ne 0 ]; then
              echo "❌ Syntax Error in $file"
              FAIL=true
            fi
          done

          if [ "$FAIL" = true ]; then
            echo "❌ Tests Failed"
            echo "🔁 Rolling Back..."
            rm -rf green
            exit 1
          fi

          echo "✅ All Tests Passed"

      - name: Promote Green to Blue
        run: |
          echo "🚀 Promoting Green to Blue..."
          rm -rf blue
          mv green blue
          echo "✅ Blue Updated"

      - name: Update Current Environment
        run: |
          echo "🔄 Updating Current..."
          rm -rf current
          ln -s blue current
          echo "✅ Current → Blue"

      - name: Deployment Complete
        run: |
          echo "🎉 Blue-Green Deployment Successful"
