name: Blue-Green Deployment (PHP Seminar Demo)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repo root (debug)
        run: |
          echo "Files at repo root:"
          ls -la

      - name: Prepare Blue (stable) environment
        run: |
          # If blue/db.php is missing on runner, create initial blue from current commit.
          if [ -f blue/db.php ]; then
            echo "✅ blue/db.php already exists in repository — using committed Blue as stable."
          else
            echo "No committed blue/db.php found in runner. Creating initial Blue from current commit..."
            rm -rf blue
            mkdir -p blue
            # Copy everything except deployment folders and .git into blue
            cp -r $(ls -A | grep -v -E '^blue$|^green$|^current$|^\.git$') blue/ || true
            echo "Initial Blue created. Contents:"
            ls -R blue || true
          fi

      - name: Deploy current commit to Green
        run: |
          echo "Deploying current commit to green/ ..."
          rm -rf green
          mkdir -p green
          cp -r $(ls -A | grep -v -E '^blue$|^green$|^current$|^\.git$') green/ || true
          echo "✅ green ready. green contents:"
          ls -R green || true

      - name: Test Green deployment and promote or rollback
        run: |
          echo "Testing green/db.php for mysqli_connect..."
          if [ -f green/db.php ] && grep -q "mysqli_connect" green/db.php; then
            echo "✅ Test passed. Promoting green → blue (update stable)."
            rm -rf blue
            mv green blue
            echo "🔹 blue updated. New blue contents:"
            ls -R blue || true
          else
            echo "❌ Test failed. Rolling back: removing green and preserving existing blue."
            rm -rf green
            echo "🔁 Rollback triggered — stable (blue) preserved."
            echo "🔹 Attempt to show blue/db.php (if exists):"
            if [ -f blue/db.php ]; then
              echo "---- blue/db.php start ----"
              sed -n '1,120p' blue/db.php || true
              echo "---- blue/db.php end ----"
            else
              echo "No blue/db.php found."
            fi
            echo "🔹 Files in blue (if any):"
            ls -R blue || true
            exit 1
          fi

      - name: Ensure current points to Blue (active)
        run: |
          if [ -L current ] || [ -d current ]; then
            rm -rf current
          fi
          ln -s blue current
          echo "✅ current -> $(readlink current)"
          echo "🔹 Files served from current (active):"
          ls -R current || true
