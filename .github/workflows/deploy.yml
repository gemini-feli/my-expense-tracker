name: Blue-Green Deployment (PHP Seminar Demo)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Prepare stable (Blue) environment
      - name: Prepare Blue (Stable) Environment
        run: |
          if [ ! -d "blue" ]; then
            echo "🔹 No blue folder found — initializing stable environment..."
            mkdir -p blue
            cp -r $(ls -A | grep -v blue | grep -v green | grep -v current | grep -v .git) blue/
          else
            echo "✅ Blue environment already exists — keeping as stable baseline."
          fi

      # Step 3: Deploy to Green (Test) Environment
      - name: Deploy to Green
        run: |
          echo "🚀 Deploying current version to Green..."
          rm -rf green
          mkdir green
          cp -r $(ls -A | grep -v blue | grep -v green | grep -v current | grep -v .git) green/
          echo "✅ Green environment deployed."

      # Step 4: Automated test (simple check for mysqli_connect)
      - name: Test Green Deployment
        run: |
          echo "🔍 Testing green/db.php for mysqli_connect..."
          if grep -q "mysqli_connect" green/db.php; then
            echo "✅ Test passed — new version is stable."
            rm -rf blue
            mv green blue
            echo "🔹 Blue environment updated with new stable version."
          else
            echo "❌ Test failed. Rolling back: removing green and preserving existing blue."
            rm -rf green
            echo "🔁 Rollback triggered — stable (blue) preserved."
            echo "🔹 Attempt to show blue/db.php (if exists):"
            if [ -f blue/db.php ]; then
              echo "---- blue/db.php start ----"
              cat blue/db.php
              echo "---- blue/db.php end ----"
            else
              echo "⚠️  blue/db.php missing!"
            fi
            exit 1
          fi

      # Step 5: Update current symlink to point to Blue (stable)
      - name: Update Current Environment
        run: |
          echo "🔄 Updating current/ to point to blue/..."
          rm -rf current
          ln -s blue current
          echo "✅ Current now points to stable (blue)."
