name: Blue-Green Deployment (PHP Seminar Demo)

on:
push:
branches:
- main

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup PHP
    uses: shivammathur/setup-php@v2
    with:
      php-version: '8.2'

  - name: Prepare Blue Environment
    run: |
      if [ ! -d "blue" ]; then
        mkdir -p blue
        cp -r $(ls -A | grep -v blue | grep -v green | grep -v current | grep -v .git) blue/
      fi

  - name: Deploy to Green
    run: |
      rm -rf green
      mkdir green
      cp -r $(ls -A | grep -v blue | grep -v green | grep -v current | grep -v .git) green/

  - name: Test Green Deployment
    run: |
      FAIL=false

      CRITICAL_FILES=("green/db.php" "green/dashboard.php" "green/add_expense.php" "green/login.php")

      for f in "${CRITICAL_FILES[@]}"; do
        if [ ! -f "$f" ]; then
          echo "Missing file: $f"
          FAIL=true
        fi
      done

      for file in $(find green -name "*.php"); do
        php -l "$file" > /dev/null 2>&1
        if [ $? -ne 0 ]; then
          echo "Syntax error in $file"
          FAIL=true
        fi
      done

      if [ "$FAIL" = true ]; then
        rm -rf green
        exit 1
      fi

  - name: Promote Green to Blue
    run: |
      rm -rf blue
      mv green blue

  - name: Update Current Environment
    run: |
      rm -rf current
      ln -s blue current

  - name: Deployment Complete
    run: |
      echo "🎉 Blue-Green Deployment Successful"
```
