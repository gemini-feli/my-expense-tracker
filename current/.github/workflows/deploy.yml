name: Simulate Blue-Green Deployment (Seminar Demo)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Committed Stable Environment
        run: |
          echo "✅ Using committed stable environment for rollback demonstration."
          ls -R stable/

      - name: Simulate Deploy to Green
        run: |
          echo "Deploying current code to Green environment..."
          rm -rf green/
          mkdir -p green/
          # Copy all files from current commit except stable folder
          cp -r $(ls -A | grep -v stable | grep -v green) green/
          echo "✅ Green environment ready."

      - name: Run Automated Test
        run: |
          echo "Testing Green environment..."
          # Fail test if mysqli_connect is missing in db.php
          if grep -q "mysqli_connect" green/db.php; then
            echo "✅ Test passed. Updating stable environment."
            rm -rf stable/
            mv green/ stable/
          else
            echo "❌ Test failed. Rolling back to previous stable version..."
            rm -rf green/
            echo "🔁 Rollback triggered successfully — stable version preserved"
            echo "🔹 Contents of stable/db.php after rollback:"
            cat stable/db.php || echo "No stable db.php found"
            echo "🔹 Files in stable environment:"
            ls -R stable/
            exit 1
          fi

      - name: Show Deployment Result
        run: |
          if [ -d "stable" ]; then
            echo "✔ Active environment: Stable"
            echo "🔹 Files in stable environment:"
            ls -R stable/
          else
            echo "❌ Deployment failed, no stable environment."
          fi
